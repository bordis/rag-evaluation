[project]
name = "rag-evaluation-api"
version = "0.1.0"
description = "Backend do estudo de avaliacao cega de pipelines RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "pymilvus>=2.5",
    "httpx>=0.28",
    "openai>=1.59",
    "pypdf>=5.1",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"
# Migracoes sao geradas pelo alembic revision --autogenerate; reformata-las so cria ruido.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exige Postgres, Milvus e Docling no ar (nao roda por padrao)",
]
addopts = "-m 'not integration'"
