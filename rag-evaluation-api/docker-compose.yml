services:
  postgres:
    container_name: rag-postgres
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${DB_NAME:-rag-evaluation}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
      # Sem o IPv6, "localhost" espera o ::1 expirar (30s) antes de cair no 127.0.0.1.
      - "[::1]:5432:5432"

  etcd:
    container_name: rag-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./volumes/etcd:/etcd
    command: >
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: rag-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: rag-milvus
    image: milvusdb/milvus:v2.6.19
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  docling:
    container_name: rag-docling
    image: quay.io/docling-project/docling-serve:v1.19.0
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
      # Sem isso o servidor recusa picture_description_api, usado para descrever as imagens.
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      # Com antivirus que inspeciona HTTPS, sem a raiz dele as descricoes de imagem falham.
      REQUESTS_CA_BUNDLE: ${DOCLING_CA_BUNDLE:-}
      SSL_CERT_FILE: ${DOCLING_CA_BUNDLE:-}
    volumes:
      - ./volumes/certs:/certs:ro
    ports:
      - "5001:5001"

  reranker:
    container_name: rag-reranker
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    # Revisao fixa: o modelo faz parte do tratamento e nao pode mudar no meio da coleta. Lote
    # pequeno porque, com o padrao (16384 tokens), o aquecimento esgota a memoria do Docker. O
    # limite impede que um pico aqui derrube o Milvus junto.
    command: >
      --model-id BAAI/bge-reranker-v2-m3
      --revision 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
      --max-batch-tokens 2048
      --max-client-batch-size 64
      --tokenization-workers 2
    mem_limit: 4g
    volumes:
      - ./volumes/tei:/data
    ports:
      - "127.0.0.1:8081:80"

volumes:
  postgres-data:
