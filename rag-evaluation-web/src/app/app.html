<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Início — Avaliação de Pipeline RAG">
    <svg class="brand__mark" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path
        fill="currentColor"
        d="M12 1.5v9M12 13.5v9M1.5 12h9M13.5 12h9M4.6 4.6l6.3 6.3M13.1 13.1l6.3 6.3M19.4 4.6l-6.3 6.3M10.9 13.1l-6.3 6.3"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
      />
    </svg>
    <span class="brand__text">Avaliação RAG</span>
  </a>

  <nav class="menu" aria-label="Menu principal">
    <div class="menu__grupo" role="group" aria-labelledby="menu-avaliador">
      <span id="menu-avaliador" class="menu__rotulo">Avaliador</span>
      <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
        Início
      </a>
      <a routerLink="/documentos" routerLinkActive="ativo">Documentos</a>
    </div>
    <div class="menu__grupo" role="group" aria-labelledby="menu-admin">
      <span id="menu-admin" class="menu__rotulo">Admin</span>
      <a routerLink="/admin/estudos" routerLinkActive="ativo">Estudos</a>
      <a routerLink="/admin/documentos" routerLinkActive="ativo">Documentos</a>
      <a routerLink="/admin/pipelines" routerLinkActive="ativo">Pipelines</a>
    </div>
  </nav>
</header>

<main class="content">
  <router-outlet />
</main>
