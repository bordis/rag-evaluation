<button type="button" class="card" [attr.aria-busy]="abrindo()" (click)="onSelecionar()">
  <span class="card__icon" aria-hidden="true">{{ documento().icone }}</span>

  <span class="card__area">{{ documento().area }}</span>
  <span class="card__title font-display">{{ documento().titulo }}</span>
  <span class="card__desc">{{ documento().descricao }}</span>

  <span class="card__footer">
    <app-progress-badge [respondidas]="respondidas()" [total]="total()" />
    @if (abrindo()) {
      <span class="card__cta"><span class="spinner" aria-hidden="true"></span>Abrindo…</span>
    } @else {
      <span class="card__cta">Avaliar →</span>
    }
  </span>
</button>
