<div class="etapas">
  <div class="etapas__resumo">
    <span class="etapas__titulo font-display">
      @if (concluido()) {
        Todas respondidas
      } @else {
        Pergunta {{ respondidas() + 1 }} de {{ total() }}
      }
    </span>
    <span class="etapas__contagem">{{ respondidas() }} de {{ total() }} respondidas</span>
  </div>

  <!-- O resumo acima já diz tudo a quem usa leitor de tela. -->
  <div class="trilha" aria-hidden="true">
    <span class="trilha__fundo">
      <span class="trilha__avanco" [style.transform]="'scaleX(' + avanco() + ')'"></span>
    </span>
    <ol class="nos">
      @for (etapa of etapas(); track etapa.indice) {
        <li class="no" [class.no--feita]="etapa.feita" [class.no--atual]="etapa.atual">
          @if (etapa.feita) {
            <svg viewBox="0 0 16 16" width="14" height="14">
              <path
                d="M3 8.5l3.2 3L13 4.8"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          } @else {
            {{ etapa.indice + 1 }}
          }
        </li>
      }
    </ol>
  </div>
</div>
